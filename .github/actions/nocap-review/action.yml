name: nocap review
description: Review a pull request's diff for skipped, deleted or weakened tests, and post the result as a sticky comment.
author: nocap

inputs:
  github-token:
    description: 'Token used to post the comment. Needs pull-requests: write.'
    default: ${{ github.token }}
  nocap:
    description: How to invoke nocap. Default uses the published package.
    default: npx --yes @anv1858/nocap@latest
  fail-on-findings:
    description: Fail the check when the diff weakens tests.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Compute the pull request diff
      id: diff
      shell: bash
      run: |
        base="origin/${GITHUB_BASE_REF}"
        git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
        git diff --no-color "${base}"...HEAD > "${RUNNER_TEMP}/nocap.diff" || git diff --no-color > "${RUNNER_TEMP}/nocap.diff"
        echo "path=${RUNNER_TEMP}/nocap.diff" >> "$GITHUB_OUTPUT"

    - name: Run nocap review
      id: review
      shell: bash
      run: |
        body="$(${{ inputs.nocap }} review --diff "${{ steps.diff.outputs.path }}")"
        {
          echo 'body<<NOCAP_EOF'
          echo "$body"
          echo 'NOCAP_EOF'
        } >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
          ${{ inputs.nocap }} review --diff "${{ steps.diff.outputs.path }}" --fail-on-findings >/dev/null
        fi

    - name: Post or update the sticky comment
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- nocap-review -->';
          const review = ${{ toJSON(steps.review.outputs.body) }};
          const body = `${marker}\n${review}`;
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request?.number;
          if (!issue_number) return;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
