name: nocap-review

# Dogfoods the nocap review Action on this repo's own pull requests, and serves
# as the example others can copy (swapping the local action and build for
# `uses: gautam1858/nocap/.github/actions/nocap-review@main`).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs get a read-only token and cannot comment; skip them cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: ./.github/actions/nocap-review
        with:
          nocap: node dist/cli/index.js
